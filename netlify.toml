[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Lets Outlook (lead replies) fetch the brochure PDFs so they can be attached to emails.
[[headers]]
  for = "/assets/documents/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
